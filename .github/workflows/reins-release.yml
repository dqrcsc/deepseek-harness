name: Release (Reins Distribution)

on:
  push:
    tags:
      - 'reins-v*'
  workflow_dispatch:
    inputs:
      edition_version:
        description: Reins edition version (such as v1.0.0) when dispatching manually without a reins-v* tag.
        type: string
        required: false
        default: 'v1.0.0'
      publish:
        description: Publish verified archives and installers to GitHub Releases.
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: reins-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  plan:
    name: resolve version & publication plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      edition_version: ${{ steps.meta.outputs.edition_version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      should_publish: ${{ steps.meta.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Resolve edition version and release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.edition_version }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs'

          const rawInput = (process.env.REF_TYPE === 'tag' && process.env.REF_NAME?.startsWith('reins-'))
            ? process.env.REF_NAME
            : (process.env.INPUT_VERSION || 'v1.0.0')
          const stripped = rawInput.trim().replace(/^reins-/iu, '').replace(/^v/iu, '')
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u.test(stripped)) {
            throw new Error(`Invalid Reins edition version: ${rawInput}`)
          }
          const editionVersion = `v${stripped}`
          const releaseTag = `reins-${editionVersion}`
          const shouldPublish = (process.env.EVENT_NAME === 'push' && process.env.REF_TYPE === 'tag')
            || process.env.INPUT_PUBLISH === 'true'
          const prerelease = stripped.includes('-')

          appendFileSync(
            process.env.GITHUB_OUTPUT,
            [
              `edition_version=${editionVersion}`,
              `release_tag=${releaseTag}`,
              `should_publish=${String(shouldPublish)}`,
              `prerelease=${String(prerelease)}`,
              '',
            ].join('\n'),
          )
          JS

  build:
    needs: plan
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-latest
          - target: darwin-x64
            runner: macos-15-intel
          - target: win32-x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - name: Enable Windows Developer Mode (build-host workspace links)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/reins-node-runtime
          key: reins-node-runtime-${{ matrix.target }}-${{ hashFiles('scripts/primary-runtime/lock.json') }}

      - name: Install workspace dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm install --frozen-lockfile; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 10
          done
          exit 1

      - name: Build, smoke-verify, and archive target distribution
        shell: bash
        run: >-
          pnpm exec tsx scripts/build-reins-release.ts
          --target "${{ matrix.target }}"
          --edition-version "${{ needs.plan.outputs.edition_version }}"
          --repo "${{ github.repository }}"
          --cache-dir "$HOME/.cache/reins-node-runtime"
          --no-manifest

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: reins-target-${{ matrix.target }}
          path: |
            .reins-dist/reins-${{ needs.plan.outputs.edition_version }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  finalize:
    needs: [plan, build]
    name: finalize latest.json & checksums
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-js-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: reins-target-*
          path: .reins-dist
          merge-multiple: true

      - name: Assemble latest.json, SHA256SUMS.txt, and zero-admin installers
        run: >-
          pnpm exec tsx scripts/build-reins-release.ts
          --finalize-manifest .reins-dist
          --edition-version "${{ needs.plan.outputs.edition_version }}"
          --require-all-targets

      - name: Verify SHA256SUMS.txt
        run: cd .reins-dist && sha256sum -c SHA256SUMS.txt

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: reins-release-bundle
          path: |
            .reins-dist/*.tar.gz
            .reins-dist/*.zip
            .reins-dist/latest.json
            .reins-dist/SHA256SUMS.txt
            .reins-dist/install.sh
            .reins-dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.plan.outputs.should_publish == 'true'
    needs: [plan, finalize]
    name: publish GitHub Release (${{ needs.plan.outputs.release_tag }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: reins-release-bundle
          path: .reins-dist

      - name: Verify release bundle hashes before upload
        run: cd .reins-dist && sha256sum -c SHA256SUMS.txt

      - name: Publish assets to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          EDITION_VERSION: ${{ needs.plan.outputs.edition_version }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          {
            printf '## 执辔 Reins %s\n\n' "$EDITION_VERSION"
            printf '### 一行免管理员安装 / Zero-Admin Quick Install\n\n'
            printf '**macOS (Apple Silicon & Intel)**:\n```sh\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | bash\n```\n\n' "$GH_REPO"
            printf '**Windows (x64 PowerShell)**:\n```powershell\nirm https://github.com/%s/releases/latest/download/install.ps1 | iex\n```\n\n' "$GH_REPO"
            printf '### 已安装用户一键热升级 / In-Place Upgrade\n```sh\nreins upgrade\n```\n'
          } > "$NOTES_FILE"

          PRERELEASE_FLAG=()
          case "$EDITION_VERSION" in
            *-*) PRERELEASE_FLAG=(--prerelease) ;;
          esac

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$TARGET_COMMIT" \
              --title "执辔 Reins ${EDITION_VERSION}" \
              --notes-file "$NOTES_FILE" \
              "${PRERELEASE_FLAG[@]}"
          fi

          gh release upload "$RELEASE_TAG" --clobber \
            .reins-dist/*.tar.gz \
            .reins-dist/*.zip \
            .reins-dist/latest.json \
            .reins-dist/SHA256SUMS.txt \
            .reins-dist/install.sh \
            .reins-dist/install.ps1
